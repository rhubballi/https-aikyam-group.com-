<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="rccBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="rccGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56,189,248,0.12)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#rccBg)" />
  <rect width="1200" height="800" fill="url(#rccGrid)" />

  <!-- Foundation Earth Bed Level -->
  <rect y="640" width="1200" height="160" fill="#0f172a" />
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#38bdf8" stroke-width="4"/>

  <!-- Heavy Deep Concrete Raft Foundation -->
  <rect x="150" y="520" width="900" height="120" rx="6" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <text x="180" y="585" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#94a3b8" letter-spacing="2">M40 HIGH-STRENGTH REINFORCED MONOLITHIC RAFT</text>

  <!-- Rebar Mesh Cage Detail (TMT 500D) -->
  <g transform="translate(180, 260)" stroke="#06b6d4" stroke-width="2" opacity="0.85">
    <!-- Vertical Rebars -->
    <line x1="0" y1="0" x2="0" y2="260" />
    <line x1="30" y1="0" x2="30" y2="260" />
    <line x1="60" y1="0" x2="60" y2="260" />
    <line x1="90" y1="0" x2="90" y2="260" />
    <line x1="120" y1="0" x2="120" y2="260" />
    <line x1="150" y1="0" x2="150" y2="260" />
    <line x1="180" y1="0" x2="180" y2="260" />
    <line x1="210" y1="0" x2="210" y2="260" />
    <!-- Horizontal Stirrups / Ties -->
    <line x1="-10" y1="30" x2="220" y2="30" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-10" y1="70" x2="220" y2="70" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-10" y1="110" x2="220" y2="110" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-10" y1="150" x2="220" y2="150" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-10" y1="190" x2="220" y2="190" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-10" y1="230" x2="220" y2="230" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Poured Concrete Column with Shuttering / Formwork -->
  <g transform="translate(480, 200)">
    <!-- Modular Formwork Panels -->
    <rect x="0" y="0" width="240" height="320" fill="#0f766e" stroke="#14b8a6" stroke-width="3" rx="6"/>
    <!-- Formwork Stiffeners -->
    <line x1="0" y1="80" x2="240" y2="80" stroke="#2dd4bf" stroke-width="4"/>
    <line x1="0" y1="160" x2="240" y2="160" stroke="#2dd4bf" stroke-width="4"/>
    <line x1="0" y1="240" x2="240" y2="240" stroke="#2dd4bf" stroke-width="4"/>
    <!-- Tie Rods & Wing Nuts -->
    <circle cx="30" cy="40" r="8" fill="#f8fafc"/>
    <circle cx="210" cy="40" r="8" fill="#f8fafc"/>
    <circle cx="30" cy="120" r="8" fill="#f8fafc"/>
    <circle cx="210" cy="120" r="8" fill="#f8fafc"/>
    <circle cx="30" cy="200" r="8" fill="#f8fafc"/>
    <circle cx="210" cy="200" r="8" fill="#f8fafc"/>
  </g>

  <!-- Concrete Boom Placer Pouring -->
  <g transform="translate(800, 100)">
    <polygon points="0,0 200,80 180,95 -10,10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <line x1="200" y1="80" x2="160" y2="380" stroke="#06b6d4" stroke-width="12" stroke-linecap="round"/>
    <circle cx="160" cy="380" r="22" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Technical Spec Watermark & Badge -->
  <g transform="translate(60, 60)">
    <rect width="360" height="85" rx="14" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="34" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#38bdf8" letter-spacing="1">JP CONSTRUCTIONS</text>
    <text x="25" y="60" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">Heavy RCC Works &amp; Structural Foundations</text>
  </g>
</svg>
