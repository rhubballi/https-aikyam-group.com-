<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="diPipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#155e75" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#pipeSky)" />

  <!-- River / Reservoir Water Reservoir -->
  <rect y="480" width="1200" height="320" fill="#083344" />
  <path d="M 0 480 Q 300 500 600 480 T 1200 490 L 1200 800 L 0 800 Z" fill="#0d9488" opacity="0.4" />

  <!-- Deep Monolithic Intake Jackwell in Strata -->
  <g transform="translate(250, 240)">
    <!-- Jackwell Outer Cylinder (12m Dia Representation) -->
    <rect x="0" y="80" width="220" height="360" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <!-- Steining / Caisson Segments -->
    <line x1="0" y1="160" x2="220" y2="160" stroke="#475569" stroke-width="3"/>
    <line x1="0" y1="240" x2="220" y2="240" stroke="#475569" stroke-width="3"/>
    <line x1="0" y1="320" x2="220" y2="320" stroke="#475569" stroke-width="3"/>
    <!-- Pumphouse Dome Structure on Top -->
    <path d="M 10 80 Q 110 0 210 80 Z" fill="#0f766e" stroke="#2dd4bf" stroke-width="3"/>
    <circle cx="110" cy="40" r="16" fill="#f0fdfa"/>
    <!-- Intake Ports with Trash Racks -->
    <rect x="40" y="340" width="140" height="60" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="340" x2="60" y2="400" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="340" x2="80" y2="400" stroke="#ffffff" stroke-width="2"/>
    <line x1="100" y1="340" x2="100" y2="400" stroke="#ffffff" stroke-width="2"/>
    <line x1="120" y1="340" x2="120" y2="400" stroke="#ffffff" stroke-width="2"/>
    <line x1="140" y1="340" x2="140" y2="400" stroke="#ffffff" stroke-width="2"/>
    <line x1="160" y1="340" x2="160" y2="400" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Large Diameter Ductile Iron (DI) Transmission Pipeline Alignment -->
  <g transform="translate(470, 480)">
    <!-- Pipeline Section 1 -->
    <rect x="0" y="20" width="180" height="90" rx="8" fill="url(#diPipe)" stroke="#083344" stroke-width="2"/>
    <!-- Flanged Collar -->
    <rect x="175" y="10" width="25" height="110" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>

    <!-- Pipeline Section 2 -->
    <rect x="200" y="20" width="220" height="90" rx="8" fill="url(#diPipe)" stroke="#083344" stroke-width="2"/>
    <!-- Flanged Collar -->
    <rect x="415" y="10" width="25" height="110" rx="6" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>

    <!-- Pipeline Section 3 Extending off screen -->
    <rect x="440" y="20" width="300" height="90" rx="8" fill="url(#diPipe)" stroke="#083344" stroke-width="2"/>

    <!-- Concrete Thrust Blocks & Pedestals -->
    <rect x="80" y="110" width="60" height="100" fill="#334155" rx="4"/>
    <rect x="310" y="110" width="60" height="100" fill="#334155" rx="4"/>
    <rect x="540" y="110" width="60" height="100" fill="#334155" rx="4"/>
  </g>

  <!-- Hydraulic Crane Lowering Pipe -->
  <g transform="translate(750, 160)">
    <polygon points="120,40 180,40 240,260 210,260" fill="#0d9488" stroke="#115e59" stroke-width="2"/>
    <line x1="120" y1="40" x2="120" y2="340" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Technical Spec Watermark & Badge -->
  <g transform="translate(60, 80)">
    <rect width="380" height="85" rx="14" fill="#0f172a" opacity="0.85" stroke="#14b8a6" stroke-width="2"/>
    <text x="25" y="34" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#2dd4bf" letter-spacing="1">JP CONSTRUCTIONS</text>
    <text x="25" y="60" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">Intake Jackwells &amp; Bulk DI Water Pipelines</text>
  </g>
</svg>
