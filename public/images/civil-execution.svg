<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="execSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="40%" stop-color="#0e7490" />
      <stop offset="80%" stop-color="#155e75" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="execGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(45,212,191,0.15)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="1200" fill="url(#execSky)" />
  <rect width="1000" height="1200" fill="url(#execGrid)" />

  <!-- Construction Scaffolding & Tower Crane Hierarchy -->
  <g transform="translate(150, 100)">
    <!-- Tower Mast -->
    <rect x="300" y="80" width="36" height="700" fill="#0d9488" stroke="#134e4a" stroke-width="3"/>
    <!-- Diagonal Lattice Cross Bracing -->
    <g stroke="#99f6e4" stroke-width="2.5" opacity="0.8">
      <line x1="300" y1="100" x2="336" y2="160" />
      <line x1="336" y1="160" x2="300" y2="220" />
      <line x1="300" y1="220" x2="336" y2="280" />
      <line x1="336" y1="280" x2="300" y2="340" />
      <line x1="300" y1="340" x2="336" y2="400" />
      <line x1="336" y1="400" x2="300" y2="460" />
      <line x1="300" y1="460" x2="336" y2="520" />
      <line x1="336" y1="520" x2="300" y2="580" />
      <line x1="300" y1="580" x2="336" y2="640" />
      <line x1="336" y1="640" x2="300" y2="700" />
      <line x1="300" y1="700" x2="336" y2="760" />
    </g>

    <!-- Crane Jib Truss -->
    <polygon points="-120,80 500,80 500,65 318,10 -120,65" fill="#0891b2" stroke="#164e63" stroke-width="3"/>
    <rect x="-110" y="70" width="60" height="35" fill="#1e293b" rx="4"/>
    <rect x="340" y="60" width="35" height="35" fill="#f0fdfa" rx="4"/>

    <!-- Hoist Cable lifting Prefab Girder -->
    <line x1="220" y1="80" x2="220" y2="350" stroke="#f8fafc" stroke-width="3" stroke-dasharray="5 5"/>
    <rect x="100" y="350" width="240" height="45" rx="6" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
    <text x="130" y="380" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#0f172a">PRECAST PSC GIRDER</text>
  </g>

  <!-- Heavy Bridge Pier Structure -->
  <g transform="translate(100, 750)">
    <rect x="80" y="0" width="640" height="70" rx="12" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <rect x="180" y="70" width="140" height="320" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="480" y="70" width="140" height="320" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- Engineers on Site Badge Overlay -->
  <g transform="translate(80, 80)">
    <rect width="400" height="90" rx="16" fill="#0f172a" opacity="0.9" stroke="#14b8a6" stroke-width="2"/>
    <text x="25" y="36" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#2dd4bf" letter-spacing="1">CIVIL ENGINEERING</text>
    <text x="25" y="64" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#f8fafc">Certified Turnkey Infrastructure Delivery</text>
  </g>

  <g transform="translate(620, 1020)">
    <rect width="300" height="90" rx="16" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="36" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#38bdf8">20+ YEARS</text>
    <text x="25" y="64" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">Field Execution Record</text>
  </g>
</svg>
