<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background rounded hexagon / square -->
  <rect x="5" y="5" width="110" height="110" rx="28" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Architectural bridge arch / crane geometry -->
  <path d="M 20 85 Q 60 40 100 85" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 35 85 L 35 60 M 60 85 L 60 45 M 85 85 L 85 60" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Monogram JP -->
  <text x="60" y="56" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1.5">
    JP
  </text>
  <text x="60" y="102" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#F59E0B" text-anchor="middle" letter-spacing="3">
    INDIA
  </text>
</svg>
